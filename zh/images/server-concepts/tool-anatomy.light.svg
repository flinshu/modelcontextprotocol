<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560">
  <style>
    :root {
    --bg: #f8fafc;
    --bg-grid: #e2e8f0;
    --mask: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --arrow: #64748b;
    --color-primary-fill: rgba(6,182,212,0.12);
    --color-primary-stroke: #0891b2;
    --color-secondary-fill: rgba(5,150,105,0.12);
    --color-secondary-stroke: #059669;
    --color-tertiary-fill: rgba(124,58,237,0.12);
    --color-tertiary-stroke: #7c3aed;
    --color-accent-fill: rgba(217,119,6,0.12);
    --color-accent-stroke: #d97706;
    --color-alert-fill: rgba(225,29,72,0.12);
    --color-alert-stroke: #e11d48;
    --color-connector-fill: rgba(234,88,12,0.12);
    --color-connector-stroke: #ea580c;
    --color-neutral-fill: rgba(100,116,139,0.12);
    --color-neutral-stroke: #64748b;
    --color-highlight-fill: rgba(59,130,246,0.12);
    --color-highlight-stroke: #3b82f6;
}
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .f { fill: var(--text); font-size: 12px; font-weight: 600; }
    .d { fill: var(--text-muted); font-size: 11px; }
    .c { fill: var(--text); font-size: 11px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="a-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-primary-stroke)"/></marker>
    <marker id="a-s" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="40" fill="var(--text)" font-size="18" font-weight="700">一个工具的“说明书”：输入和输出都有约定</text>
  <text x="30" y="62" fill="var(--text-muted)" font-size="12">以原文的 searchFlights（搜航班）为例；左边是 tools/list 返回的定义，右边是一次 tools/call 的来回</text>

  <!-- definition -->
  <rect x="30" y="85" width="380" height="420" rx="12" fill="var(--mask)"/>
  <rect x="30" y="85" width="380" height="420" rx="12" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="50" y="112" fill="var(--text)" font-size="14" font-weight="700">工具定义（tools/list 返回）</text>

  <rect x="50" y="128" width="340" height="52" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)"/>
  <text x="64" y="150" class="f">name: "searchFlights"</text>
  <text x="64" y="168" class="d">唯一标识，调用时必须一字不差</text>

  <rect x="50" y="190" width="340" height="52" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)"/>
  <text x="64" y="212" class="f">title: "Search Flights"</text>
  <text x="64" y="230" class="d">给人看的显示名</text>

  <rect x="50" y="252" width="340" height="52" rx="6" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)"/>
  <text x="64" y="274" class="f">description: "Search for available flights"</text>
  <text x="64" y="292" class="d">给模型看：它靠这句话决定什么时候用</text>

  <rect x="50" y="314" width="340" height="80" rx="6" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)"/>
  <text x="64" y="336" class="f">inputSchema（JSON Schema）</text>
  <text x="64" y="356" class="c">origin · destination · date</text>
  <text x="64" y="374" class="d">三个都必填，date 是日期格式</text>

  <rect x="50" y="404" width="340" height="80" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)"/>
  <text x="64" y="426" class="f">outputSchema（可选）</text>
  <text x="64" y="446" class="c">flights: [{ flightNumber, priceUsd }]</text>
  <text x="64" y="464" class="d">声明结果的结构，方便程序直接用</text>

  <!-- call -->
  <rect x="520" y="110" width="530" height="130" rx="12" fill="var(--mask)"/>
  <rect x="520" y="110" width="530" height="130" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="540" y="136" fill="var(--text)" font-size="14" font-weight="700">请求：tools/call</text>
  <text x="540" y="162" class="c">name: "searchFlights"</text>
  <text x="540" y="184" class="c">arguments: { origin: "New York",</text>
  <text x="540" y="202" class="c">             destination: "Barcelona", date: "2027-06-15" }</text>
  <text x="540" y="224" class="d">另外照例带上 _meta（版本、能力、身份）</text>

  <!-- result -->
  <rect x="520" y="275" width="530" height="230" rx="12" fill="var(--mask)"/>
  <rect x="520" y="275" width="530" height="230" rx="12" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="540" y="301" fill="var(--text)" font-size="14" font-weight="700">结果（resultType: "complete"）</text>

  <rect x="540" y="315" width="490" height="78" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)"/>
  <text x="556" y="337" class="f">structuredContent</text>
  <text x="556" y="357" class="c">{ flights: [{ flightNumber: "EX101", priceUsd: 640 }] }</text>
  <text x="556" y="377" class="d">结构化结果，符合 outputSchema，程序可直接解析</text>

  <rect x="540" y="405" width="490" height="78" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)"/>
  <text x="556" y="427" class="f">content: [{ type: "text", text: "{\"flights\":…}" }]</text>
  <text x="556" y="447" class="d">同一份数据再序列化成文本，照顾只认文本的旧客户端</text>
  <text x="556" y="465" class="d">content 还可以是图片、音频、资源链接</text>

  <!-- arrows -->
  <path d="M 390,354 C 460,354 460,190 516,190" fill="none" stroke="var(--color-primary-stroke)" stroke-width="1.5" marker-end="url(#a-p)"/>
  <text x="448" y="262" fill="var(--color-primary-stroke)" font-size="11" text-anchor="middle">参数必须</text>
  <text x="448" y="278" fill="var(--color-primary-stroke)" font-size="11" text-anchor="middle">符合</text>
  <path d="M 390,444 C 460,444 460,354 536,354" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#a-s)"/>
  <text x="458" y="420" fill="var(--color-secondary-stroke)" font-size="11" text-anchor="middle">结果符合</text>

  <text x="30" y="535" fill="var(--text-muted)" font-size="12">每个工具只做一件事，输入输出边界清楚；工具执行前，应用可以先请用户确认。</text>
</svg>
