<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560">
  <style>
    :root {
      --bg: #0f172a; --bg-grid: #1e293b; --mask: #0f172a; --text: white; --text-muted: #94a3b8; --arrow: #64748b;
      --color-primary-fill: rgba(8,51,68,0.4); --color-primary-stroke: #22d3ee;
      --color-secondary-fill: rgba(6,78,59,0.4); --color-secondary-stroke: #34d399;
      --color-tertiary-fill: rgba(76,29,149,0.4); --color-tertiary-stroke: #a78bfa;
      --color-neutral-fill: rgba(30,41,59,0.5); --color-neutral-stroke: #94a3b8;
    }
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .k { fill: var(--text-muted); font-size: 11px; }
    .v { fill: var(--text); font-size: 12px; }
    .m { fill: var(--text); font-size: 11px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="40" fill="var(--text)" font-size="18" font-weight="700">三块积木，三个“说了算”的人</text>
  <text x="30" y="62" fill="var(--text-muted)" font-size="12">比喻：一家餐厅。模型是厨师，AI 应用是前台服务员，用户是顾客</text>

  <!-- tools: model -->
  <rect x="30" y="85" width="320" height="400" rx="12" fill="var(--mask)"/>
  <rect x="30" y="85" width="320" height="400" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <rect x="50" y="102" width="110" height="26" rx="13" fill="var(--color-primary-stroke)" fill-opacity="0.18" stroke="var(--color-primary-stroke)"/>
  <text x="105" y="120" fill="var(--color-primary-stroke)" font-size="12" font-weight="700" text-anchor="middle">模型说了算</text>
  <text x="50" y="162" fill="var(--text)" font-size="20" font-weight="700">工具 Tools</text>
  <text x="50" y="186" class="v">主动调用的函数，能“动手”</text>
  <text x="50" y="220" class="k">比喻</text><text x="50" y="240" class="v">厨师自己伸手拿厨具</text>
  <text x="50" y="272" class="k">例子</text><text x="50" y="292" class="v">搜航班 · 发消息 · 建日程</text>
  <text x="50" y="324" class="k">协议方法</text><text x="50" y="344" class="m">tools/list · tools/call</text>
  <text x="50" y="376" class="k">人怎么把关</text>
  <text x="50" y="396" class="v">逐次审批弹窗 · 预先授权</text>
  <text x="50" y="416" class="v">可选择开关某个工具 · 操作日志</text>
  <text x="50" y="460" class="k">能写库、调 API、改文件，所以要人盯着</text>

  <!-- resources: application -->
  <rect x="370" y="85" width="320" height="400" rx="12" fill="var(--mask)"/>
  <rect x="370" y="85" width="320" height="400" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <rect x="390" y="102" width="110" height="26" rx="13" fill="var(--color-secondary-stroke)" fill-opacity="0.18" stroke="var(--color-secondary-stroke)"/>
  <text x="445" y="120" fill="var(--color-secondary-stroke)" font-size="12" font-weight="700" text-anchor="middle">应用说了算</text>
  <text x="390" y="162" fill="var(--text)" font-size="20" font-weight="700">资源 Resources</text>
  <text x="390" y="186" class="v">被动、只读的数据，用作上下文</text>
  <text x="390" y="220" class="k">比喻</text><text x="390" y="240" class="v">前台决定递哪些资料给厨师</text>
  <text x="390" y="272" class="k">例子</text><text x="390" y="292" class="v">文档 · 知识库 · 日历</text>
  <text x="390" y="324" class="k">协议方法</text><text x="390" y="344" class="m">resources/list · templates/list</text>
  <text x="390" y="362" class="m">resources/read</text>
  <text x="390" y="394" class="k">在界面上</text>
  <text x="390" y="414" class="v">资源选择器 · 搜索过滤</text>
  <text x="390" y="434" class="v">自动附加 · 智能推荐</text>
  <text x="390" y="460" class="k">应用可以挑一部分、做检索，或整份给模型</text>

  <!-- prompts: user -->
  <rect x="710" y="85" width="320" height="400" rx="12" fill="var(--mask)"/>
  <rect x="710" y="85" width="320" height="400" rx="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <rect x="730" y="102" width="110" height="26" rx="13" fill="var(--color-tertiary-stroke)" fill-opacity="0.18" stroke="var(--color-tertiary-stroke)"/>
  <text x="785" y="120" fill="var(--color-tertiary-stroke)" font-size="12" font-weight="700" text-anchor="middle">用户说了算</text>
  <text x="730" y="162" fill="var(--text)" font-size="20" font-weight="700">提示词模板 Prompts</text>
  <text x="730" y="186" class="v">预制的指令模板，带参数</text>
  <text x="730" y="220" class="k">比喻</text><text x="730" y="240" class="v">顾客从菜单上点一份套餐</text>
  <text x="730" y="272" class="k">例子</text><text x="730" y="292" class="v">规划假期 · 总结会议 · 写邮件</text>
  <text x="730" y="324" class="k">协议方法</text><text x="730" y="344" class="m">prompts/list · prompts/get</text>
  <text x="730" y="376" class="k">在界面上</text>
  <text x="730" y="396" class="v">斜杠命令 /plan-vacation</text>
  <text x="730" y="416" class="v">命令面板 · 快捷按钮 · 右键菜单</text>
  <text x="730" y="460" class="k">必须用户主动选，不会被自动触发</text>

  <text x="30" y="518" fill="var(--text)" font-size="12" font-weight="600">要点</text>
  <text x="80" y="518" fill="var(--text-muted)" font-size="12">同一个服务器可以三样都提供。“谁说了算”决定了它在界面上怎么出现、要不要用户确认。</text>
  <text x="80" y="540" fill="var(--text-muted)" font-size="12">资源模板和提示词模板的参数都支持自动补全（completion/complete）。</text>
</svg>
