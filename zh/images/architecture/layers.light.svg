<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530">
  <style>
    :root {
    --bg: #f8fafc;
    --bg-grid: #e2e8f0;
    --mask: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --arrow: #64748b;
    --color-primary-fill: rgba(6,182,212,0.12);
    --color-primary-stroke: #0891b2;
    --color-secondary-fill: rgba(5,150,105,0.12);
    --color-secondary-stroke: #059669;
    --color-tertiary-fill: rgba(124,58,237,0.12);
    --color-tertiary-stroke: #7c3aed;
    --color-accent-fill: rgba(217,119,6,0.12);
    --color-accent-stroke: #d97706;
    --color-alert-fill: rgba(225,29,72,0.12);
    --color-alert-stroke: #e11d48;
    --color-connector-fill: rgba(234,88,12,0.12);
    --color-connector-stroke: #ea580c;
    --color-neutral-fill: rgba(100,116,139,0.12);
    --color-neutral-stroke: #64748b;
    --color-highlight-fill: rgba(59,130,246,0.12);
    --color-highlight-stroke: #3b82f6;
}
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="40" fill="var(--text)" font-size="18" font-weight="700">两层结构：信里写什么（数据层）× 怎么寄信（传输层）</text>
  <text x="30" y="62" fill="var(--text-muted)" font-size="12">数据层在里，传输层在外；同一封 JSON-RPC 信，走哪条“邮路”内容都一样</text>

  <!-- outer: transport layer -->
  <rect x="30" y="85" width="940" height="360" rx="14" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="50" y="112" fill="var(--color-accent-stroke)" font-size="14" font-weight="700">传输层（外层）：怎么寄信</text>
  <text x="50" y="131" fill="var(--text-muted)" font-size="11">建立连接 · 消息分帧 · 认证</text>

  <!-- inner: data layer -->
  <rect x="55" y="148" width="560" height="275" rx="12" fill="var(--mask)"/>
  <rect x="55" y="148" width="560" height="275" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="75" y="174" fill="var(--color-secondary-stroke)" font-size="14" font-weight="700">数据层（里层）：信里写什么</text>
  <text x="75" y="193" fill="var(--text-muted)" font-size="11">基于 JSON-RPC 2.0：请求 · 响应 · 通知</text>

  <!-- data layer chips -->
  <rect x="75" y="210" width="255" height="92" rx="8" fill="var(--mask)"/>
  <rect x="75" y="210" width="255" height="92" rx="8" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1.2"/>
  <text x="202" y="236" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">发现</text>
  <text x="202" y="257" fill="var(--text-muted)" font-size="11" text-anchor="middle">server/discover</text>
  <text x="202" y="276" fill="var(--text-muted)" font-size="11" text-anchor="middle">问服务器：版本、能力、身份</text>

  <rect x="345" y="210" width="255" height="92" rx="8" fill="var(--mask)"/>
  <rect x="345" y="210" width="255" height="92" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.2"/>
  <text x="472" y="236" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">服务器功能</text>
  <text x="472" y="257" fill="var(--text-muted)" font-size="11" text-anchor="middle">工具 · 资源 · 提示词模板</text>
  <text x="472" y="276" fill="var(--text-muted)" font-size="11" text-anchor="middle">服务器能提供什么</text>

  <rect x="75" y="315" width="255" height="92" rx="8" fill="var(--mask)"/>
  <rect x="75" y="315" width="255" height="92" rx="8" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.2"/>
  <text x="202" y="341" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">客户端功能</text>
  <text x="202" y="362" fill="var(--text-muted)" font-size="11" text-anchor="middle">征询（elicitation）</text>
  <text x="202" y="381" fill="var(--text-muted)" font-size="11" text-anchor="middle">服务器反过来问用户</text>

  <rect x="345" y="315" width="255" height="92" rx="8" fill="var(--mask)"/>
  <rect x="345" y="315" width="255" height="92" rx="8" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.2"/>
  <text x="472" y="341" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">实用功能</text>
  <text x="472" y="362" fill="var(--text-muted)" font-size="11" text-anchor="middle">通知 · 进度</text>
  <text x="472" y="381" fill="var(--text-muted)" font-size="11" text-anchor="middle">实时更新、长任务进度条</text>

  <!-- transports -->
  <rect x="645" y="148" width="300" height="125" rx="10" fill="var(--mask)"/>
  <rect x="645" y="148" width="300" height="125" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="795" y="176" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">stdio</text>
  <text x="795" y="200" fill="var(--text-muted)" font-size="11" text-anchor="middle">标准输入 / 输出</text>
  <text x="795" y="220" fill="var(--text-muted)" font-size="11" text-anchor="middle">同一台机器上的进程直接对话</text>
  <text x="795" y="240" fill="var(--text-muted)" font-size="11" text-anchor="middle">没有网络开销 → 本地服务器</text>

  <rect x="645" y="290" width="300" height="133" rx="10" fill="var(--mask)"/>
  <rect x="645" y="290" width="300" height="133" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="795" y="318" fill="var(--text)" font-size="14" font-weight="700" text-anchor="middle">Streamable HTTP</text>
  <text x="795" y="342" fill="var(--text-muted)" font-size="11" text-anchor="middle">HTTP POST 发消息</text>
  <text x="795" y="362" fill="var(--text-muted)" font-size="11" text-anchor="middle">可选 SSE 流式回复</text>
  <text x="795" y="382" fill="var(--text-muted)" font-size="11" text-anchor="middle">令牌 / API key，推荐 OAuth</text>
  <text x="795" y="402" fill="var(--text-muted)" font-size="11" text-anchor="middle">→ 远程服务器</text>

  <!-- analogy footer -->
  <rect x="30" y="465" width="18" height="18" rx="4" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)"/>
  <text x="56" y="479" fill="var(--text-muted)" font-size="12">信纸：写什么由数据层规定，开发者最常打交道的部分</text>
  <rect x="30" y="495" width="18" height="18" rx="4" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)"/>
  <text x="56" y="509" fill="var(--text-muted)" font-size="12">邮路：本地走 stdio，远程走 Streamable HTTP，SDK 通常帮你处理好</text>
</svg>
